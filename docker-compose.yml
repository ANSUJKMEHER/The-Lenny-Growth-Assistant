name: lenny-growth-assistant

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
      POSTGRES_DB: lenny
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      # Optional: only needed to pass custom cloud API keys. The app has safe
      # defaults for everything else, so a fresh clone works without `.env`.
      - path: .env
        required: false
    environment:
      # Override the DB URL to reach the internal service regardless of .env:
      DATABASE_URL: postgresql+asyncpg://lenny:lenny@db:5432/lenny
      # Ollama runs on the HOST machine. Inside the container `localhost` is
      # the container itself, so we always route to the host via the
      # host-gateway alias below (works on Linux/macOS/Windows). Override via
      # OLLAMA_BASE_URL_DOCKER only if your host Ollama listens elsewhere.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
      # Schema is managed by Alembic in the container (see Dockerfile CMD).
      AUTO_CREATE_TABLES: "false"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
